  <text class="tag" x="44" y="344">Human-centered systems, motion, discovery</text>
  <text class="card-copy" x="44" y="382"><tspan x="44" dy="0">A user-centered orbit suggests research systems, people in</tspan><tspan x="44" dy="23">motion, and iterative inquiry.</tspan></text>
  <text class="tag" x="44" y="456">BEST FOR</text>
  <text class="card-muted" x="135" y="456"><tspan x="135" dy="0">Website mastheads, favicon seed, section dividers</tspan></text>
