<title>UX in Science logo explorations</title>
<rect width="1600" height="1960" fill="#F7FFF6"/>
<text class="sheet-title" x="80" y="95">UX in Science Logo Explorations</text>
<text class="sheet-body" x="80" y="144"><tspan x="80" dy="0">Six editable vector directions using the brand guide colors. Each keeps UX explicit and adds</tspan><tspan x="80" dy="32">simple human/team and science cues.</tspan></text>
