    font-size: 110px;
    font-weight: 820;
    letter-spacing: 0;
    fill: #34113F;
  }
  .wordmark-dark {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 110px;
    font-weight: 820;
    letter-spacing: 0;
