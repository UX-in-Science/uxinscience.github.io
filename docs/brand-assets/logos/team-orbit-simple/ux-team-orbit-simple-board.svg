  .body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 21px;
    font-weight: 400;
    letter-spacing: 0;
    fill: #202320;
  }
  .caption {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
    fill: #34113F;
  }
  .thin {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .motion-copy {
    opacity: 1;
  }
  .motion-static {
    opacity: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .motion-copy {
      opacity: 0;
    }
    .motion-static {
      opacity: 1;
    }
  }

</style>
</defs>


