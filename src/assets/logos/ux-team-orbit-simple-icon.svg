<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="370" viewBox="0 0 500 370" role="img">
<defs>
<style>

  .wordmark {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 110px;
    font-weight: 820;
    letter-spacing: 0;
    fill: #34113F;
  }
  .wordmark-dark {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 110px;
    font-weight: 820;
    letter-spacing: 0;
    fill: #F7FFF6;
  }
  .small-label {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0;
    fill: #34113F;
  }
  .body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 21px;
    font-weight: 400;
    letter-spacing: 0;
    fill: #202320;
  }
  .caption {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
    fill: #34113F;
  }
  .thin {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .motion-copy {
    opacity: 1;
  }
  .motion-static {
    opacity: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .motion-copy {
      opacity: 0;
    }
    .motion-static {
      opacity: 1;
    }
  }

</style>
</defs>


